name: Apply Remote Image Patch (one-off)

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'URL of the replacement file'
        required: true
        type: string
      target_path:
        description: 'Repo-relative path to overwrite'
        required: true
        type: string
      commit_message:
        description: 'Commit message'
        required: true
        type: string

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download replacement file
        run: |
          curl -fL "${{ inputs.image_url }}" -o "${{ inputs.target_path }}"
          ls -la "${{ inputs.target_path }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.target_path }}"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "${{ inputs.commit_message }}"
            git push
          fi
